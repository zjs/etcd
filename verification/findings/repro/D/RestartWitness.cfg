SPECIFICATION RestartWitnessSpec

CONSTANTS

    s1 = s1
    s2 = s2
    s3 = s3
    s4 = s4
    s5 = 5

    InitServer  = {s1, s2, s3}
    Server      = {s1, s2, s3, s4}

    ReconfigurationLimit    = 2
    MaxTermLimit            = 5
    RequestLimit            = 3

    Timeout         <- MCTimeout
    Send            <- MCSend
    ClientRequest   <- MCClientRequest
    AddNewServer    <- MCAddNewServer
    DeleteServer    <- MCDeleteServer
    AddLearner      <- MCAddLearner

    InitServerVars  <- etcdInitServerVars
    InitLogVars     <- etcdInitLogVars
    InitConfigVars  <- etcdInitConfigVars

    Nil = 0

    ValueEntry  = "ValueEntry"
    ConfigEntry = "ConfigEntry"

    Follower    = "Follower"
    Candidate   = "Candidate"
    Leader      = "Leader"
    RequestVoteRequest      =   "RequestVoteRequest"
    RequestVoteResponse     =   "RequestVoteResponse"
    AppendEntriesRequest    =   "AppendEntriesRequest"
    AppendEntriesResponse   =   "AppendEntriesResponse"

CHECK_DEADLOCK
    TRUE

INVARIANTS
    MoreThanOneLeaderInv
